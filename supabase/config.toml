project_id = "laboratorio"

[functions.github]
verify_jwt = false

[functions.admin]
verify_jwt = false

[functions.impresion]
verify_jwt = false

[auth]
enable_signup = false
# Contraseña asignada por el administrador (acceso/): mínimo 12 caracteres y sin exigir tipos de carácter (las generadas
# son letras y números; con requisitos, createUser respondería weak_password).
minimum_password_length = 12
password_requirements = ""

[auth.email]
enable_confirmations = false
