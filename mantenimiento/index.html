<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maintenance Plan · Laboratorio Polinyà</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Same tokens and components as the Calibration Plan. The plan comes from the Excel in SharePoint (read-only here); the app adds programmed and done maintenance. */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --surface-2:#E4ECEE; --fg:#12242B; --muted:#566C74; --line:#CFDCE0;
  --accent:#0A6C7C; --accent-ink:#FFFFFF; --accent-soft:#D3EAEE;
  --ok:#2D7F55; --ok-soft:#D8EEE1; --warn:#A8690A; --warn-soft:#F7E8CC; --crit:#B8322B; --crit-soft:#F6D9D6;
  --st-plan:#3866AE; --st-inf:#80539F; --st-canc:#98A6AC; --st-noap:#9A5A1E;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D161A; --surface:#142026; --surface-2:#1B2A31; --fg:#E1EBEE; --muted:#90A4AC; --line:#293B43;
  --accent:#43B4C4; --accent-ink:#04232A; --accent-soft:#123840;
  --ok:#55C28D; --ok-soft:#163626; --warn:#E3A43A; --warn-soft:#3A2D14; --crit:#EF6A60; --crit-soft:#41201E;
  --st-plan:#6C9BE0; --st-inf:#B48AD6; --st-canc:#5E6E75; --st-noap:#D99A5B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D161A; --surface:#142026; --surface-2:#1B2A31; --fg:#E1EBEE; --muted:#90A4AC; --line:#293B43;
  --accent:#43B4C4; --accent-ink:#04232A; --accent-soft:#123840;
  --ok:#55C28D; --ok-soft:#163626; --warn:#E3A43A; --warn-soft:#3A2D14; --crit:#EF6A60; --crit-soft:#41201E;
  --st-plan:#6C9BE0; --st-inf:#B48AD6; --st-canc:#5E6E75; --st-noap:#D99A5B; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
a{color:var(--accent)}
.mono,.ref{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.muted{color:var(--muted)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.brand{display:flex;flex-direction:column;align-items:flex-start;margin-right:auto}
.brand .row1{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:22px;font-weight:700;letter-spacing:.01em}
.brand .tag{font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:1px 5px}
.home{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;display:block;margin-bottom:2px}
.home:hover{color:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;width:100%;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--fg)}
.tabs .n{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border-radius:8px;padding:0 6px;margin-left:4px;color:var(--muted)}
.tabs .n.crit{background:var(--crit-soft);color:var(--crit)} .tabs .n.warn{background:var(--warn-soft);color:var(--warn)}
.gh{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.gh:hover{border-color:var(--accent)}
.gh i{width:8px;height:8px;border-radius:50%;background:var(--st-canc)}
.gh.on i{background:var(--ok)} .gh.bad i{background:var(--crit)} .gh.busy i{background:var(--warn)}
.gh.on{color:var(--fg)}
/* Read-only (not connected, or no write access): the page hides editing controls. */
body.ro :is([data-act="rec-plan"],[data-act="rec-done"],[data-act="settings"],[data-act="del"]){display:none!important}
body.ro .dlg-f button[type="submit"]:not(.gh-ok){display:none}
body.ro :is([data-act="rec-plan"],[data-act="rec-done"],[data-act="settings"],[data-act="del"]){display:none!important}

main{max-width:1500px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.banner{border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--warn);border-radius:var(--r);padding:10px 14px}
.banner.crit{border-left-color:var(--crit)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
.btn.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.icon-btn{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.link{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:12px}
.panel-h h2{font-size:19px;margin-right:auto}
.panel-h h3{font-size:16px;margin-right:auto}
.view-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.view-h h2{font-size:26px;margin-right:auto}
.fgrp{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.fgrp .fl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.fc{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.fc:hover{border-color:var(--accent);color:var(--fg)}
.fc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fc small{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:4px}
.filters.multi{flex-direction:column;align-items:flex-start;gap:8px}
.search,.fsel{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 10px;min-width:0;max-width:100%}
.search{width:240px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:grid;gap:2px;text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.kpi b{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.kpi.crit b{color:var(--crit)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)} .kpi.inf b{color:var(--st-inf)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* Alerts */
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.alerts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:var(--r);background:var(--surface-2);border-left:4px solid var(--warn);cursor:pointer}
.alerts li.crit{border-left-color:var(--crit)}
.alerts li.inf{border-left-color:var(--st-inf)}
.alerts li:hover{outline:1px solid var(--line)}
.alerts .what b{font-family:var(--f-mono);font-size:12px;margin-right:6px}
.alerts .what small{display:block;color:var(--muted);font-size:13px}
.sev{font-family:var(--f-mono);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:3px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.crit .sev,.sev.crit{background:var(--crit-soft);color:var(--crit)}
.inf .sev{background:color-mix(in srgb,var(--st-inf) 15%,var(--surface));color:var(--st-inf)}
.empty-ok{padding:14px;border-radius:var(--r);background:var(--surface-2);color:var(--muted)}

/* Upcoming months */
.months{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .ml{font-family:var(--f-display);font-weight:700;font-size:16px}
.mrow .ml small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.mrow.late .ml{color:var(--crit)}
.labgrp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:4px}
.labgrp .lab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.codebtn{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:1px 6px;cursor:pointer;color:var(--fg)}
.codebtn:hover{border-color:var(--accent)}
.codebtn.plan{border-color:var(--st-plan);color:var(--st-plan)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap;border:1px solid currentColor;color:var(--st)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.k-valid{--st:var(--ok)} .k-soon,.k-nodata{--st:var(--warn)} .k-overdue,.k-nok{--st:var(--crit)} .k-pending{--st:var(--st-inf)}
.k-beforeuse{--st:var(--st-plan)} .k-notreq,.k-reserved,.k-retired,.k-none{--st:var(--st-canc)} .k-oos{--st:var(--st-noap)}
.res{font-size:11px;font-weight:700;padding:1px 7px;border-radius:3px;letter-spacing:.04em;white-space:nowrap}
.res.OK{background:var(--ok-soft);color:var(--ok)} .res.NOK{background:var(--crit-soft);color:var(--crit)} .res.NA{background:var(--surface-2);color:var(--muted)}
.chip{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--surface-2);font-family:var(--f-mono);white-space:nowrap}
.iss{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.iss.info{background:var(--surface-2);color:var(--muted)}
.tick{color:var(--ok);font-weight:700} .cross{color:var(--muted)}

/* Tables */
.scroll-x{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .nowrap{white-space:nowrap}
.tbl .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tbl.mini{font-size:13px} .tbl.mini td,.tbl.mini th{padding:5px 6px}
.tbl tr.off td{color:var(--muted)}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.th-sort:hover{color:var(--fg)}
.th-sort .arr{font-size:9px;opacity:.35}
.th-sort[aria-sort] .arr{opacity:1;color:var(--accent)}
.code{font-family:var(--f-mono);font-size:13px;font-weight:500;white-space:nowrap}
.folder{font-size:12px;text-decoration:none;white-space:nowrap}
.cell-sel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:2px 4px;font-size:13px}
.due.crit{color:var(--crit);font-weight:600} .due.warn{color:var(--warn);font-weight:600}

/* Annual plan */
.pg-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.zoom{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.zoom button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px}
.zoom button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pg-wrap{overflow:auto;max-height:calc(100dvh - 250px);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pg{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.pg th,.pg td{border-bottom:1px solid var(--line);padding:0}
.pg thead th{position:sticky;top:0;z-index:2;background:var(--surface);font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500;padding:5px 0;text-align:center;line-height:1.15}
.pg thead th small{display:block;font-size:9px}
.pg thead th.now{background:var(--accent);color:var(--accent-ink)}
.pg .rh{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:4px 10px;min-width:240px;max-width:260px;border-right:1px solid var(--line);font-family:var(--f-body)}
.pg thead .rh{z-index:3}
.pg .rh button{all:unset;cursor:pointer;display:block;width:100%}
.pg .rh b{font-family:var(--f-mono);font-size:12px;font-weight:500}
.pg .rh .d{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.pg .rh .pill{font-size:11px;padding:0 6px;margin-left:4px}
.pg .rh.crit{box-shadow:inset 4px 0 0 var(--crit)} .pg .rh.warn{box-shadow:inset 4px 0 0 var(--warn)}
.pg td.m{width:36px;min-width:36px;height:36px;text-align:center;cursor:pointer;border-left:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.pg td.m:hover{background:var(--surface-2)}
.pg .jan{border-left:2px solid var(--line)!important}
.pg td.now{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.pg .sec th{background:var(--surface-2);text-align:left;padding:5px 0;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.pg .sec th span{position:sticky;left:10px;padding-left:10px}
.pg tfoot th,.pg tfoot td{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;padding:5px 0;background:var(--surface-2)}
.pg tfoot .rh{background:var(--surface-2);font-size:12px;font-weight:600}
.mk{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:4px;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.mk.due{box-shadow:inset 0 0 0 2px var(--crit);color:var(--crit)}
.mk.due.late{background:var(--crit);color:#fff}
.mk.proj{opacity:.45}
.mk.plan{background:var(--st-plan);color:#fff}
.mk.done{background:var(--ok);color:#fff}
.mk.done.open{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.mk.plan.due,.mk.done.due{box-shadow:inset 0 0 0 2px var(--crit)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend .mk{width:22px;height:18px;font-size:11px;margin-right:4px;vertical-align:middle}

/* Review */
.rev-sum{display:flex;flex-wrap:wrap;gap:6px}
details.panel>summary{cursor:pointer;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary h2::before{content:'▸ ';color:var(--muted)}
details.panel[open]>summary h2::before{content:'▾ '}
details.panel:not([open])>summary{margin-bottom:0}
.rev-sum a{text-decoration:none}
.rev-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rev-list li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:var(--r);background:var(--surface-2)}

/* Forms & dialog */
.field{display:grid;gap:4px;min-width:0;align-content:start}
.field label,.field .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.field input:not([type="checkbox"]),.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:64px}
.field.req label::after{content:" *";color:var(--crit)}
.field .help{font-size:12px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);font-weight:400}
dialog{border:0;border-radius:10px;padding:0;background:var(--surface);color:var(--fg);width:min(980px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.narrow{width:min(640px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(8,20,24,.55)}
.dlg-form{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:22px}
.dlg-body{padding:14px 18px;overflow-y:auto;display:grid;gap:14px}
.dlg-f{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 12px;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;min-width:0}
legend{font-family:var(--f-display);font-weight:700;font-size:14px;padding:0 6px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.span2{grid-column:1/-1}
.form-err{color:var(--crit);font-weight:600;font-size:14px}
.hint{font-size:13px;padding:8px 10px;border-radius:var(--r);background:var(--surface-2)}
.hint.ok{background:var(--ok-soft);color:var(--ok)} .hint.crit{background:var(--crit-soft);color:var(--crit)} .hint.warn{background:var(--warn-soft);color:var(--warn)}
.recs{display:grid;gap:14px}
.recs .panel-h{margin-bottom:6px}
.guide{margin:0;padding-left:20px;font-size:14px;display:grid;gap:2px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:600;z-index:100;max-width:calc(100vw - 32px)}
.empty{display:grid;gap:12px;justify-items:start;padding:28px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty h3{font-size:22px}
.empty p{margin:0;max-width:62ch;color:var(--muted)}
@media (max-width:600px){.view-h h2{font-size:22px}.brand h1{font-size:19px}.search{width:100%}.mrow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.acts-l{margin:0;padding-left:18px;display:grid;gap:2px;font-size:14px}

const $=s=>document.querySelector(s);

const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join('');
const nowIso=()=>new Date().toISOString();
const todayIso=()=>{const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
/* Maintenance is planned by month, as in the Excel. A month is "YYYY-MM"; a maintenance is due until the end of its month. */
const toMonth=s=>{const m=/^(\d{4})-(\d{2})/.exec(s||''); return m?`${m[1]}-${m[2]}`:''};
const mIdx=s=>{const m=/^(\d{4})-(\d{2})/.exec(s||''); return m?(+m[1])*12+(+m[2]-1):null};
const mStr=i=>`${Math.floor(i/12)}-${pad(i%12+1)}`;
const addM=(s,n)=>{const i=mIdx(s); return i==null||!n?'':mStr(i+ +n)};
const nowIdx=()=>{const d=new Date(); return d.getFullYear()*12+d.getMonth()};
const fmtM=s=>{const i=mIdx(s); return i==null?'—':`${pad(i%12+1)}/${Math.floor(i/12)}`};
const fmtML=s=>{const i=mIdx(s); return i==null?'—':`${tr('mn')[i%12]} ${Math.floor(i/12)}`};
const fmtD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m?`${m[3]}/${m[2]}/${m[1]}`:/^\d{4}-\d{2}$/.test(s||'')?fmtM(s):s?esc(s):'—'};
const perLabel=p=>!p?'—':p%12===0?tr('per_y',p/12):tr('per_m',p);
const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
const isNA=v=>/^(n\/?a|-|—)?$/i.test(clean(v));
function toast(msg){const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,4200)}
const eqCode=id=>{const e=EQ.get(id); return e?e.code:String(id||'').replace(/^eq-/,'')};
const codesOf=p=>(p.equipmentIds||[]).map(eqCode);
const typeOf=p=>{const t=norm(p.actionType); return !t?'':/int.*ext/.test(t)?'Internal / External':t.startsWith('ext')?'External':t.startsWith('int')?'Internal':clean(p.actionType)};
const provOf=p=>{const v=clean(p.provider); return /^fluidra$/i.test(v)?'FLUIDRA':v};

/* ---------- Domain ----------
   A plan row comes from the Excel (last and next maintenance). Maintenance logged as done in the app after the Excel's last
   date moves the next date (last + period); programmed maintenance is shown in the annual plan and in the overview. */
function rowInfo(p){
  const recs=IX.recs.get(p.id)||[], done=recs.filter(r=>r.status==='Done'), planned=recs.filter(r=>r.status==='Planned').sort((a,b)=>String(a.month).localeCompare(String(b.month)));
  const xlLast=toMonth(p.last), appLast=done.map(r=>toMonth(r.date||r.month)).sort().pop()||'', per=+p.periodMonths||0;
  const fromApp=appLast&&(!xlLast||appLast>xlLast);
  const last=fromApp?appLast:xlLast;
  const due=fromApp&&per?addM(appLast,per):(toMonth(p.next)||addM(xlLast,per));
  const di=mIdx(due), n=nowIdx(), warn=+S.cfg.warnMonths||0, plan=planned[0]||null;
  const base={last,due,fromApp,planned:plan,months:di==null?null:di-n,recs};
  if(di==null) return {...base,key:'nodata'};
  if(n>di) return {...base,key:'overdue'};
  if(di-n<=warn) return {...base,key:'soon'};
  return {...base,key:'valid'};
}
function issuesOf(p){
  const out=[], add=(type,text)=>out.push({type,sev:ISSUE_WARN.has(type)?'warn':'info',text});
  const l=toMonth(p.last), nx=toMonth(p.next), per=+p.periodMonths||0, i=IX.info.get(p.id);
  if((M.unmatched||[]).some(u=>norm(typeof u==='string'?u:u.name)===norm(p.equipment))) add('unmatched',tr('i_unmatched',clean(p.equipment)));
  if(!l||!nx) add('nodates',tr('i_nodates',!l));
  if(l&&nx&&mIdx(nx)<=mIdx(l)) add('nextbefore',tr('i_nextbefore',fmtM(nx),fmtM(l)));
  else if(l&&nx&&per&&addM(l,per)!==nx) add('nextdiff',tr('i_nextdiff',fmtM(nx),fmtM(l),perLabel(per),fmtM(addM(l,per))));
  if(l&&mIdx(l)>nowIdx()) add('lastfuture',tr('i_lastfuture',fmtM(l)));
  if(typeOf(p)==='External'&&isNA(p.provider)) add('noprovider',tr('i_noprovider'));
  if(i.planned&&mIdx(i.planned.month)<nowIdx()) add('plannedpast',tr('i_plannedpast',fmtM(i.planned.month)));
  return out;
}
function buildIndex(){
  const rows=(M.plan||[]).map(p=>({...p,group:(p.equipmentIds||[]).length?GROUPS[0]:GROUPS[1]}));
  const recs=new Map(), push=(m,k,v)=>{if(!m.has(k)) m.set(k,[]); m.get(k).push(v)};
  for(const [id,r] of Object.entries(DATA.records)) push(recs,r.planId,{id,...r});
  IX={rows,byId:new Map(rows.map(p=>[p.id,p])),recs,info:new Map(),issues:new Map()};
  for(const p of rows) IX.info.set(p.id,rowInfo(p));
  for(const p of rows) IX.issues.set(p.id,issuesOf(p));
  IX.providers=[...new Set(rows.map(provOf).filter(v=>v&&!isNA(v)))].sort();
  IX.types=[...new Set(rows.map(typeOf).filter(Boolean))].sort();
}
/* Documents and corrective actions of a plan row: same equipment code, or (facilities) the same name in the folder. */
const sameEq=(p,ids,folder)=>(p.equipmentIds||[]).length?(ids||[]).some(x=>p.equipmentIds.includes(x)):!!folder&&norm(folder).endsWith(norm(p.equipment));
const docsOf=p=>(M.documents||[]).filter(d=>sameEq(p,d.equipmentIds,d.folder)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
const corrOf=p=>(M.corrective||[]).filter(c=>(p.equipmentIds||[]).includes(c.equipmentId));
const rowLabel=p=>p?`${clean(p.equipment)} · ${clean((p.actions||[])[0]||'')}`:tr('row_gone');

const matchRow=p=>matchQ(p.equipment,...(p.actions||[]),p.provider,p.components,...codesOf(p));
function filteredRows(){
  const f=S.f;

    if(f.type.length&&!f.type.includes(typeOf(p))) return false;

/* Filters are toggle buttons: several values of one filter combine with OR, different filters with AND. Nothing pressed = all. */
function chips(scope,key,label,opts){
  const cur=S[scope][key];

}

function alertText(p,i){
  const prov=!isNA(p.provider)?` · ${provOf(p)}`:'', plan=i.planned?tr(mIdx(i.planned.month)<nowIdx()?'a_wasprog':'a_prog',fmtM(i.planned.month)):tr('a_noprog');
  if(i.key==='overdue') return tr('a_over',fmtML(i.due),tr('n_month',-i.months))+prov+plan;

function vOverview(){
  if(!IX.rows.length) return emptyState();
  const n=nowIdx(), cnt=k=>IX.rows.filter(p=>IX.info.get(p.id).key===k).length;

  const y12=mStr(n-12), corr=(M.corrective||[]).filter(c=>toMonth(c.problemDate)>=y12).length;
  const act=IX.rows.filter(p=>ACTION_KEYS.includes(IX.info.get(p.id).key)).map(p=>({p,i:IX.info.get(p.id)})).sort((a,b)=>KEY_RANK[a.i.key]-KEY_RANK[b.i.key]||(mIdx(a.i.due)??0)-(mIdx(b.i.due)??0));
  const kpi=(k,label,val,sub,cls)=>`<button class="kpi ${cls}" data-act="kpi" data-k="${k}"><span class="eyebrow">${label}</span><b>${val}</b><span class="muted">${sub}</span></button>`;
  /* Upcoming: overdue first, then each month with maintenance due, grouped by provider so external visits can be batched. */
  const buckets=[], over=IX.rows.filter(p=>IX.info.get(p.id).key==='overdue');
  if(over.length) buckets.push({late:true,label:tr('o_late'),sub:tr('n_item',over.length),list:over});
  for(let m=n;m<n+12;m++){const list=IX.rows.filter(p=>{const i=IX.info.get(p.id); return mIdx(i.due)===m||(i.planned&&mIdx(i.planned.month)===m&&mIdx(i.due)!==m&&i.key!=='overdue')}); if(list.length) buckets.push({label:fmtML(mStr(m)),sub:tr('n_item',list.length),list});}
  const byProv=list=>{const g=new Map(); list.forEach(p=>{const k=isNA(p.provider)?tr('o_noprov'):provOf(p); if(!g.has(k)) g.set(k,[]); g.get(k).push(p)}); return [...g].sort((a,b)=>b[1].length-a[1].length).map(([l,ps])=>`<div class="labgrp"><span class="lab">${esc(l)}</span>${ps.map(p=>{const pl=IX.info.get(p.id).planned; return `<button class="codebtn ${pl?'plan':''}" data-act="row" data-id="${esc(p.id)}" title="${esc(rowLabel(p))}${pl?esc(tr('a_prog',fmtM(pl.month))):''}">${esc(clean(p.equipment))}</button>`}).join('')}</div>`).join('')};
  return `<div class="view-h"><h2>${tr('o_title')}</h2><span class="muted">${new Date().toLocaleDateString(LabLang.locale(),{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span></div>

    ${kpi('soon',esc(tr('k_soon',S.cfg.warnMonths)),cnt('soon'),tr('k_soon_s'),cnt('soon')?'warn':'')}
    ${kpi('planned',tr('k_prog'),progr,tr('k_prog_s'),progr?'inf':'')}
    ${kpi('valid',tr('k_valid'),cnt('valid'),tr('k_valid_s',IX.rows.length),'ok')}
    ${kpi('corrective',tr('k_corr'),corr,tr('k_corr_s'),corr?'warn':'')}
    ${kpi('documents',esc(tr('k_docs')),(M.documents||[]).length,tr('k_docs_s'),'')}
  </section>
  <div class="grid2">
    <section class="panel"><div class="panel-h"><h2>${tr('o_action')}</h2><span class="muted">${tr('n_item',act.length)}</span></div>
      ${act.length?`<ul class="alerts">${act.map(({p,i})=>`<li class="${i.key==='overdue'?'crit':''}" data-act="row" data-id="${esc(p.id)}"><span class="sev">${esc(stLbl(i.key))}</span><span class="what"><b>${esc(codesOf(p).join(', ')||tr('facility'))}</b>${esc(rowLabel(p))}<small>${esc(alertText(p,i))}</small></span></li>`).join('')}</ul>`:`<div class="empty-ok">${tr('o_nothing')}</div>`}

function vAnnual(){
  if(!IX.rows.length) return emptyState();
  const n=nowIdx(), y0=S.plan.start??Math.floor(n/12), start=y0*12, span=S.plan.span, end=start+span-1;
  const months=[...Array(span)].map((_,i)=>start+i), list=filteredRows();
  const due=new Map(), plannedN=new Map();
  const cells=p=>{
    const i=IX.info.get(p.id), per=+p.periodMonths||0, d0=mIdx(i.due), dues=new Map(), done=new Map();
    if(d0!=null){ dues.set(d0,'first'); if(per) for(let m=d0+per;m<=end;m+=per) dues.set(m,'proj'); }
    const xl=mIdx(toMonth(p.last)); if(xl!=null) done.set(xl,{src:'Excel'});
    for(const r of i.recs) if(r.status==='Done') done.set(mIdx(toMonth(r.date||r.month)),r);
    return months.map(m=>{
      const ms=mStr(m), dn=done.get(m), pl=i.recs.find(r=>r.status==='Planned'&&r.month===ms), dk=dues.get(m);
      if(dk) due.set(m,(due.get(m)||0)+1);
      if(pl) plannedN.set(m,(plannedN.get(m)||0)+1);
      const cls=['m',m%12===0?'jan':'',m===n?'now':''].join(' ');
      let mk='', tip=[];
      if(dn){mk=`<span class="mk done">✓</span>`; tip.push(tr('t_done',fmtM(ms))+(dn.src==='Excel'?' (Excel)':dn.by?' · '+dn.by:''));}
      else if(pl){mk=`<span class="mk plan ${dk?'due':''}">P</span>`; tip.push(tr('t_prog',fmtM(ms))+(pl.provider?' · '+pl.provider:''));}
      else if(dk){mk=`<span class="mk due ${dk==='proj'?'proj':''} ${dk==='first'&&m<n?'late':''}">M</span>`;}
      if(dk) tip.push(tr(dk==='first'?'t_due':'t_proj',fmtM(ms)));
      const rid2=dn&&dn.id?dn.id:pl?pl.id:'';
      return `<td class="${cls}" data-act="cell" data-id="${esc(p.id)}" data-m="${ms}" data-r="${esc(rid2)}" title="${esc(clean(p.equipment)+' · '+fmtML(ms)+(tip.length?'\n'+tip.join('\n'):'\n'+tr('t_click')))}">${mk}</td>`;
    }).join('');
  };
  const sec=g=>{const ps=list.filter(p=>p.group===g); if(!ps.length) return '';
    return `<tr class="sec"><th colspan="${span+1}"><span>${esc(tr('grp_'+g))} · ${ps.length}</span></th></tr>`+ps.map(p=>{const i=IX.info.get(p.id), a=clean((p.actions||[])[0]||'');
      return `<tr><th class="rh ${i.key==='overdue'?'crit':i.key==='soon'?'warn':''}"><button data-act="row" data-id="${esc(p.id)}"><b>${esc(codesOf(p).join(', ')||'')}</b> ${esc(clean(p.equipment))}${pill(i)}<span class="d">${esc(a)}${!isNA(p.provider)?' · '+esc(provOf(p)):''}</span></button></th>${cells(p)}</tr>`}).join('');};
  const body=GROUPS.map(sec).join('');
  const head=`<tr><th class="rh">${tr('th_eq')}</th>${months.map(m=>`<th class="${m%12===0?'jan':''} ${m===n?'now':''}">${tr('mn')[m%12]}<small>${m%12===0||m===start?Math.floor(m/12):'&nbsp;'}</small></th>`).join('')}</tr>`;
  const foot=`<tr><th class="rh">${tr('ft_due')}</th>${months.map(m=>`<td class="${m%12===0?'jan':''}">${due.get(m)||''}</td>`).join('')}</tr>
    <tr><th class="rh">${tr('ft_prog')}</th>${months.map(m=>`<td class="${m%12===0?'jan':''}">${plannedN.get(m)||''}</td>`).join('')}</tr>`;
  return `<div class="view-h"><h2>${tr('an_title')}</h2>
    <div class="pg-ctl"><button class="btn sm" data-act="plan-nav" data-d="-1" aria-label="${tr('an_prev')}">←</button><b>${y0}${span>12?'–'+(y0+1):''}</b><button class="btn sm" data-act="plan-nav" data-d="1" aria-label="${tr('an_next')}">→</button><button class="btn sm ghost" data-act="plan-nav" data-d="0">${tr('an_this')}</button>
    <span class="zoom"><button data-act="plan-span" data-s="12" aria-pressed="${span===12}">${tr('an_months',12)}</button><button data-act="plan-span" data-s="24" aria-pressed="${span===24}">${tr('an_months',24)}</button></span></div></div>
  ${filterBar()}
  <div class="legend"><span><span class="mk due">M</span>${tr('lg_due')}</span><span><span class="mk due late">M</span>${tr('lg_over')}</span><span><span class="mk due proj">M</span>${tr('lg_proj')}</span><span><span class="mk plan">P</span>${tr('lg_prog')}</span><span><span class="mk done">✓</span>${tr('lg_done')}</span></div>
  <p class="note">${tr('an_note')}</p>
  ${list.length?`<div class="pg-wrap"><table class="pg"><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>`:`<div class="empty-ok">${tr('no_rows')}</div>`}`;
}

function vReview(){
  if(!IX.rows.length) return emptyState();
  const groups=new Map(), add=(k,v)=>{if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(v)};
  for(const p of IX.rows) for(const it of IX.issues.get(p.id)) add(it.type,{p,it});
  for(const u of M.unmatched||[]){const name=typeof u==='string'?u:u.name; if(!IX.rows.some(p=>norm(p.equipment)===norm(name))) add('unmatched',{p:null,it:{text:tr('i_unmatched',name,u.where)}});}
  const order=ISSUE.filter(k=>groups.has(k)), total=order.reduce((n,k)=>n+groups.get(k).length,0);
  return `<div class="view-h"><h2>${tr('r_title')}</h2><span class="muted">${tr('n_find',total)}</span></div>
  <p class="note">${tr('r_note')}</p>

  ${order.map(k=>`<details class="panel" id="rev-${k}" ${ISSUE_WARN.has(k)?'open':''}><summary class="panel-h"><h2>${esc(tr('iss_'+k))}</h2><span class="${ISSUE_WARN.has(k)?'iss':'iss info'}">${tr(ISSUE_WARN.has(k)?'r_warn':'r_info')} · ${groups.get(k).length}</span></summary>
    <ul class="rev-list">${groups.get(k).map(({p,it})=>`<li>${p?`<button class="codebtn" data-act="row" data-id="${esc(p.id)}">${esc(clean(p.equipment))}</button>`:'<span></span>'}<span>${esc(it.text)}${p?` <span class="muted">— ${esc(clean((p.actions||[])[0]||''))}</span>`:''}</span><span></span></li>`).join('')}</ul></details>`).join('')}`;
}

/* ---------- Storage: private data repository Polinya-LAB/lab-data ----------
   mantenimiento/mantenimiento.json is written by the SharePoint sync task and only read here; calibraciones/calibraciones.json
   (Calibration Plan) gives the code and description of each equipment. What the app saves goes to mantenimiento/registro.json,
   which may not exist yet (the first save creates it). Same key (token) as the other lab apps; changes made close together are one commit. */
const REPO={owner:'Polinya-LAB',repo:'lab-data',branch:'main',path:'mantenimiento/registro.json',main:'mantenimiento/mantenimiento.json',cal:'calibraciones/calibraciones.json'};
const GH_API=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}`;
/* Email sign-in (acceso/lab-auth.js): with an email session the data goes through the lab's Supabase function, which
   checks the person's role in this app; with a GitHub key, straight to api.github.com as before. Without the Supabase
   configuration (LabAuth.activo false) only the key exists, exactly as before. */
const LA=window.LabAuth&&window.LabAuth.activo?window.LabAuth:null;
const APP_ID='mantenimiento';
const mailRepo=app=>`${LA.api(app)}/repos/${REPO.owner}/${REPO.repo}`;
/* The API base follows the mode, so an email session always targets the function and a key always api.github.com. */
const apiBase=()=>GH.modo==='correo'?mailRepo(APP_ID):GH_API;
const RAW=p=>`https://raw.githubusercontent.com/${REPO.owner}/${REPO.repo}/${REPO.branch}/${p}`;
const TOKEN_KEY='pd-gh-token';
/* modo: 'correo' (email session), 'clave' (GitHub key) or null. With 'correo': email, noAccess (no role in this app)
   and expired (the function answered 401). */
const GH={token:'',login:null,push:false,invalid:false,saving:false,modo:null,email:'',noAccess:false,expired:false};
try{GH.token=localStorage.getItem(TOKEN_KEY)||'';}catch(e){}
if(GH.token) GH.modo='clave';
const byMail=()=>GH.modo==='correo';
let mailBusy=false; // own sign-in/sign-out in progress: LabAuth.onCambio is not a session loss
/* Data can be read through the API (key or email session); otherwise the anonymous raw files (key mode only). */
const viaApi=()=>byMail()?!GH.expired&&!GH.noAccess:!!GH.token&&!GH.invalid;
const canWrite=()=>GH.push&&(byMail()?!GH.expired&&!GH.noAccess:!!GH.token&&!GH.invalid);
S.ro=true;
const remote={data:null,sha:null,etag:{}};
let flushTimer=null, flushing=null;
const pendingOps=[];
/* Local test mode: the data comes from local-data.js and is kept in this browser; the page neither reads from nor writes to GitHub. */
const LOCAL=!!window.MT_LOCAL, LS_LOCAL='mt.local.data';
if(LOCAL) S.ro=false;
const emptyData=()=>Object.fromEntries(COLS.map(c=>[c,{}]));
const normData=x=>{const o=emptyData(); for(const c of COLS) if(x&&x[c]&&typeof x[c]==='object') o[c]=x[c]; return o;};
const b64encode=str=>{const bytes=new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(bin);};
const b64decode=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
/* Credentials only for their own service: the email session for the lab's function, the key for api.github.com. */
const ghAuth=async url=>LA&&url.startsWith(LA.api(APP_ID).replace(/[^/]+$/,''))?await LA.cabeceras():url.startsWith('https://api.github.com/')&&GH.token?{Authorization:`Bearer ${GH.token}`}:{};
const ghFetch=async(url,opts={})=>fetch(url,{cache:'no-store',...opts,headers:{Accept:'application/vnd.github+json',...await ghAuth(url),...(opts.headers||{})}});
const httpError=res=>{const limited=res.status===429||(res.status===403&&res.headers.get('x-ratelimit-remaining')==='0'); return {code:res.status===401?'auth':limited?'rate':(res.status===403||res.status===404)?'forbidden':'unavailable',status:res.status};};
function errMsg(e){const c=e&&e.code;
  if(byMail()&&(c==='auth'||c==='not_granted'&&GH.expired)) return ta('au_e_save');
  if(byMail()&&(c==='not_granted'||c==='forbidden')) return ta('au_e_perm');
  if(c==='not_granted'||c==='forbidden') return tr('e_forb'); if(c==='auth') return tr('e_auth'); if(c==='conflict') return tr('e_conflict'); if(c==='rate') return tr('e_rate'); if(c==='unavailable') return tr('e_unav'); return tr('e_save',e&&e.message||e)}

/* Reads one file: {json, sha} or null when unchanged (ETag); {missing:true} when it does not exist. */
async function fetchFile(path,useEtag){
  if(!viaApi()){
    const res=await fetch(`${RAW(path)}?t=${Date.now()}`,{cache:'no-store'});
    if(res.status===404) throw {code:'private',status:404};
    if(!res.ok) throw httpError(res);
    return {json:await res.json(),sha:null};
  }
  const res=await ghFetch(`${apiBase()}/contents/${path}?ref=${REPO.branch}`,useEtag&&remote.etag[path]?{headers:{'If-None-Match':remote.etag[path]}}:{});
  if(res.status===304) return null;
  if(res.status===404) return {missing:true};
  if(!res.ok) throw httpError(res);
  const j=await res.json(); let text;
  if(j.content) text=b64decode(j.content);
  else{const blob=await ghFetch(`${apiBase()}/git/blobs/${j.sha}`); if(!blob.ok) throw httpError(blob); text=b64decode((await blob.json()).content);}
  remote.etag[path]=res.headers.get('etag');
  return {json:JSON.parse(text),sha:j.sha};
}
function applyOps(data,ops){
  for(const o of ops){const c=data[o.col]||(data[o.col]={});
    if(o.op==='set') c[o.id]=clone(o.data);
    else if(o.op==='update'){ if(c[o.id]) Object.assign(c[o.id],clone(o.data)); }
    else if(o.op==='delete') delete c[o.id];}
  return data;
}
function recompute(){ DATA=remote.data?applyOps(clone(remote.data),pendingOps.flat()):null; }
function commitMessage(ops){
  const base=remote.data||emptyData(), cur=o=>({...(base[o.col]||{})[o.id],...(o.data||{})});
  const label=o=>{const d=cur(o); return o.col==='config'?'settings':`${d.equipment||d.planId||o.id}${d.month?' '+d.month:''}`;};
  if(ops.length===1){const o=ops[0], verb=o.op==='delete'?'delete':o.op==='set'&&!(base[o.col]||{})[o.id]?'add':'update';
    return `Plan de mantenimiento: ${verb} ${o.col==='config'?'settings':`${cur(o).status==='Done'?'maintenance done':'programmed maintenance'} ${label(o)}`}`;}
  return `Plan de mantenimiento: ${ops.length} changes`;
}
async function commitOps(ops){
  for(let i=0;i<4;i++){
    /* The session may have expired between the save and this commit: reject it, never fall back to an anonymous read. */
    if(byMail()&&!viaApi()) throw {code:'auth'};
    const r=await fetchFile(REPO.path,false), cur=r&&!r.missing?{data:normData(r.json),sha:r.sha}:{data:emptyData(),sha:null}, next=applyOps(clone(cur.data),ops);
    const body={message:commitMessage(ops),branch:REPO.branch,content:b64encode(JSON.stringify(next,null,1)+'\n')}; if(cur.sha) body.sha=cur.sha;
    const res=await ghFetch(`${apiBase()}/contents/${REPO.path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(res.ok){const j=await res.json(); Object.assign(remote,{data:next,sha:j.content.sha}); remote.etag[REPO.path]=null; return;}
    if(res.status!==409&&res.status!==422) throw httpError(res);
    await new Promise(r=>setTimeout(r,500+Math.random()*800));
  }
  throw {code:'conflict'};
}
/* Writes show on screen at once; the app saves them together, one commit per burst of changes. */
function save(ops,msg){
  if(!ops.length) return true;
  if(LOCAL){applyOps(remote.data,ops); try{localStorage.setItem(LS_LOCAL,JSON.stringify(remote.data));}catch(e){} recompute(); render(); if(msg) toast(msg); return true;}
  if(S.ro||!canWrite()){toast(errMsg({code:'not_granted'})); return null;}
  pendingOps.push(ops); recompute(); render(); if(msg) toast(msg);
  clearTimeout(flushTimer); flushTimer=setTimeout(flushOps,700);
  return true;
}
async function flushOps(){
  if(flushing) await flushing;
  if(!pendingOps.length) return;
  const batch=pendingOps.splice(0,pendingOps.length);
  GH.saving=true; renderGh();
  flushing=(async()=>{
    try{await commitOps(batch.flat());}
    catch(err){ if(err.code==='auth'){ if(byMail()) mailExpired(); else {GH.invalid=true; GH.push=false; S.ro=true;} } toast(errMsg(err)); }
    finally{flushing=null; GH.saving=!!pendingOps.length; recompute(); render();}
  })();
  return flushing;
}
const setEq=cal=>{EQ=new Map(Object.entries((cal&&cal.equipment)||{}).map(([id,e])=>[id,{code:e.code,description:e.description}]));};
async function refresh(){
  if(LOCAL){
    if(!remote.data){let s=null; try{s=JSON.parse(localStorage.getItem(LS_LOCAL)||'null');}catch(e){} remote.data=normData(s||clone(window.MT_LOCAL.registro)); M=window.MT_LOCAL.mantenimiento; setEq(window.MT_LOCAL.calibraciones);}
    recompute(); render(); return;
  }
  if(pendingOps.length||flushing) return;
  /* Email session not connected yet (the function failed at boot or right after signing in): try again here, on every poll. */
  if(byMail()&&!GH.login&&!GH.expired){
    try{await connectMail(GH.email); render();}
    catch(err){ if(err.code==='auth') mailExpired(); if(!DATA||!M){S.noDb=true; S.privateData=err.code==='auth';} render(); return; }
  }
  /* Email session without a role in this app, or expired: no reading; what is on screen stays. */
  if(byMail()&&!viaApi()){ if(!DATA||!M){S.noDb=true; S.privateData=true;} render(); return; }
  try{
    const [m,r,c]=await Promise.all([fetchFile(REPO.main,true),fetchFile(REPO.path,true),fetchFile(REPO.cal,true).catch(()=>null)]);
    if(m&&m.missing) throw {code:'private',status:404};
    let changed=false;
    if(m){M=m.json; changed=true;}
    if(r){Object.assign(remote,r.missing?{data:emptyData(),sha:null}:{data:normData(r.json),sha:r.sha}); changed=true;}
    if(c&&!c.missing){setEq(c.json); changed=true;}
    S.noDb=false; S.privateData=false;
    if(changed){recompute(); render();}
  }catch(err){
    if(err.code==='auth'&&byMail()){mailExpired(); if(!DATA||!M){S.noDb=true; S.privateData=true;} render(); return;}
    if(err.code==='auth'){GH.invalid=true; GH.push=false; S.ro=true; return refresh();}
    if(!DATA||!M){S.noDb=true; S.privateData=err.code==='private'||err.code==='forbidden'; render();}
  }
}
async function connectGh(t){
  const h={Accept:'application/vnd.github+json',Authorization:`Bearer ${t}`};
  const [u,r]=await Promise.all([fetch('https://api.github.com/user',{headers:h,cache:'no-store'}),fetch(GH_API,{headers:h,cache:'no-store'})]);
  if(u.status===401||r.status===401) throw {code:'auth'};
  if(!u.ok) throw httpError(u); if(!r.ok) throw httpError(r);
  const user=await u.json(), repo=await r.json();
  Object.assign(GH,{token:t,login:user.login,push:!!(repo.permissions&&repo.permissions.push),invalid:false,modo:'clave',email:'',noAccess:false,expired:false});
  S.ro=!GH.push;
}
/* Email session: the function answers GET /user with the person's name and GET /repos with push = edit role in this app,
   or 403 when the person has no role in it (then no data is read). */
async function connectMail(email){
  const h={Accept:'application/vnd.github+json',...await LA.cabeceras()}, get=url=>fetch(url,{headers:h,cache:'no-store'}).catch(()=>{throw {code:'unavailable'};});
  const [u,r]=await Promise.all([get(`${LA.api(APP_ID)}/user`),get(mailRepo(APP_ID))]);
  if(u.status===401||r.status===401) throw {code:'auth'};
  if(!u.ok&&u.status!==403) throw httpError(u); if(!r.ok&&r.status!==403) throw httpError(r);
  const user=u.ok?await u.json():{}, repo=r.ok?await r.json():{};
  Object.assign(GH,{modo:'correo',email,login:user.login||email,push:!!(repo.permissions&&repo.permissions.push),invalid:false,noAccess:!r.ok,expired:false});
  S.ro=!GH.push;
}
/* The function answered 401 (session expired, or the person was removed): what is on screen stays, read-only,
   and the header button offers to sign in again. */
function mailExpired(){dlg.dataset.verified=''; GH.expired=true; GH.push=false; S.ro=true; renderGh();}
async function mailSignOut(){
  mailBusy=true; try{await LA.salir();}catch(e){} mailBusy=false;
  Object.assign(GH,{modo:null,email:'',login:null,push:false,noAccess:false,expired:false}); S.ro=true; remote.etag={};
  if(GH.token){GH.modo='clave'; try{await connectGh(GH.token);}catch(err){ if(err.code==='auth') GH.invalid=true; } await refresh();}
  else forgetPrivate(); /* No key left: the private data leaves memory and screen, so the next person on this browser does not see it. */
  render(); toast(ta('au_out'));
}
function forgetPrivate(){
  pendingOps.length=0; clearTimeout(flushTimer); remote.data=null; remote.sha=null; remote.etag={}; DATA=null; M=null; IX=null; EQ=new Map();
  S.noDb=true; S.privateData=true;
}
/* Someone else signed in on another tab (or the same person again after the session expired here): the tab follows the
   session, so name, role and data match it. What the previous person had on screen leaves memory first. */
async function mailSwitch(email){
  if(email!==GH.email) forgetPrivate();
  Object.assign(GH,{modo:'correo',email,login:null,push:false,noAccess:false,expired:false}); S.ro=true; render();
  try{await connectMail(email);}catch(err){ if(err.code==='auth') mailExpired(); }
  remote.etag={}; await refresh(); render();
}
function disconnectGh(){Object.assign(GH,{token:'',login:null,push:false,invalid:false,modo:null}); S.ro=true; try{localStorage.removeItem(TOKEN_KEY);}catch(e){} remote.etag={}; dlg.close(); render(); toast(tr('gh_off_ok'));}
function renderGh(){
  const b=$('#btn-gh'); if(!b) return;
  if(LOCAL){b.className='gh on'; b.querySelector('span').textContent=tr('gh_local'); b.title=tr('gh_local_t'); document.body.classList.remove('ro'); return;}
  if(LA&&GH.modo!=='clave'){
    b.className='gh '+(GH.expired?'bad':GH.saving?'busy':GH.login&&GH.push?'on':'');
    b.querySelector('span').textContent=GH.expired?ta('au_again'):GH.saving?ta('au_saving'):GH.login||(byMail()&&GH.email)||ta('au_btn');
    b.title=GH.expired?ta('au_expired'):GH.login?`${GH.email} · ${ta(GH.noAccess?'au_none':GH.push?'au_edit':'au_view')}`:ta('au_btn_t');
    document.body.classList.toggle('ro',!!S.ro);
    return;
  }
  b.className='gh '+(GH.invalid?'bad':GH.saving?'busy':GH.login&&GH.push?'on':'');
  b.querySelector('span').textContent=GH.invalid?tr('gh_expired'):GH.saving?tr('au_saving'):GH.login?GH.login:tr('gh_connect');
  b.title=GH.login?tr(GH.push?'gh_t_push':'gh_t_ro'):tr('gh_t');
  document.body.classList.toggle('ro',!!S.ro);
}
function openGh(){
  dlg.dataset.kind='gh'; dlg.dataset.id=''; dlg.classList.add('narrow');
  if(LA) return openMail();
  const body=`${GH.login?`<p class="note">${tr('gh_as',esc(GH.login),GH.push)}</p>`:''}
  ${keyGuide()}
  ${keyFields()}`;
  dlg.innerHTML=`<form class="dlg-form" id="dlg-form" novalidate><header class="dlg-h"><div><p class="eyebrow">${tr('au_eyebrow')}</p><h2>${tr('gh_connect')}</h2></div>${closeX()}</header>
  <div class="dlg-body">${body}<div id="f-err" class="form-err" hidden></div></div>
  <footer class="dlg-f">${GH.token?`<button type="button" class="btn ghost danger" data-act="gh-off">${tr('gh_off')}</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-act="close">${tr('cancel')}</button><button class="btn primary gh-ok" type="submit">${tr('gh_go')}</button></footer></form>`;
  if(!dlg.open) dlg.showModal(); $('#gh-token').focus();
}
const keyGuide=()=>`<ol class="guide"><li>${tr('gh_step1')}</li><li>${tr('gh_step2')}</li></ol>`;
const keyFields=()=>`<div class="field"><label for="gh-token">${tr('gh_key')}</label><input id="gh-token" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false"></div>
  <p class="note">${tr('gh_key_note',`${REPO.owner}/${REPO.repo}`)}</p>`;
/* With email sign-in configured: "Sign in with your email" first (email + password, one step), "Use a GitHub key" below. */
function openMail(){
  const signed=byMail()&&GH.login&&!GH.expired, keyOn=GH.modo==='clave'&&GH.login;
  dlg.classList.add('narrow');
  const mail=signed
    ?`<p class="note">${ta('au_as',esc(GH.login),esc(GH.email))} ${ta(GH.noAccess?'au_none':GH.push?'au_edit':'au_view')}</p>`
    :`<section class="gh-mail"><h3>${ta('au_title')}</h3>${GH.expired?`<p class="note">${ta('au_expired')}</p>`:''}
    <div class="field"><label for="gh-mail">${ta('au_mail')}</label><input id="gh-mail" type="email" autocomplete="username" spellcheck="false" value="${esc(dlg.dataset.email||GH.email||'')}"></div>
    <div class="field"><label for="gh-pass">${ta('au_pass')}</label><input id="gh-pass" type="password" autocomplete="current-password" spellcheck="false"></div>
    <p class="note">${ta('au_forgot')}</p></section>`;
  const key=signed?'':`<details class="manual gh-key" ${keyOn?'open':''}><summary>${ta('au_key')}</summary>
    ${keyOn?`<p class="note">${tr('gh_as',esc(GH.login),GH.push)}</p>`:''}
    ${keyGuide()}
    ${keyFields()}<p>${keyOn?`<button type="button" class="btn ghost danger" data-act="gh-off">${tr('gh_off')}</button> `:''}<button type="button" class="btn" data-act="gh-key">${tr('gh_go')}</button></p></details>`;
  const main=signed?'':`<button class="btn primary gh-ok" type="submit">${ta('au_enter')}</button>`;
  dlg.innerHTML=`<form class="dlg-form" id="dlg-form" novalidate><header class="dlg-h"><div><p class="eyebrow">${ta('au_eyebrow')}</p><h2>${ta('au_btn')}</h2></div>${closeX()}</header>
  <div class="dlg-body">${mail}${key}<div id="f-err" class="form-err" hidden></div></div>
  <footer class="dlg-f">${signed?`<button type="button" class="btn ghost danger" data-act="gh-out">${ta('au_signout')}</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-act="close">${ta(signed?'au_close':'au_cancel')}</button>${main}</footer></form>`;
  if(!dlg.open) dlg.showModal(); const m=$('#gh-mail'); if(m) (m.value?$('#gh-pass'):m).focus();
}
/* The password is read and the field emptied at once, so it is not left in the page. dlg.dataset.verified = the email
   whose sign-in already worked: if only the connection to the lab service failed, "Sign in" with the password field empty
   retries the connection without asking for the password again. */
async function saveMail(){
  const btn=dlg.querySelector('button[type="submit"]'), pw=$('#gh-pass'); if(!btn||!pw) return;
  const password=pw.value||''; pw.value='';
  const label=btn.textContent, busy=on=>{btn.disabled=on; btn.textContent=on?ta('au_wait'):label;};
  const email=($('#gh-mail').value||'').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+$/.test(email)) return formErr(ta('au_e_mail'));
  busy(true); // before any await, so a second Enter does not start another sign-in
  const s=!password&&dlg.dataset.verified===email?await LA.sesion():null, again=!!s&&s.email===email;
  if(!password&&!again){ busy(false); return formErr(ta('au_e_pass')); }
  dlg.dataset.email=email; let phase='login';
  try{
    mailBusy=true;
    if(!again){ dlg.dataset.verified=''; await LA.entrar(email,password); dlg.dataset.verified=email; }
    /* From here the session exists: stay in email mode, so the polling retries if the function fails now. */
    phase='connect'; Object.assign(GH,{modo:'correo',email,login:null,push:false,noAccess:false,expired:false}); S.ro=true;
    await connectMail(email);
    remote.etag={}; await refresh(); dlg.dataset.verified=''; dlg.close(); render();
    toast(GH.noAccess?ta('au_none'):`${ta('au_in',GH.login)} ${ta(GH.push?'au_edit':'au_view')}`);
  }catch(err){ busy(false); const c=err&&err.code;
    if(phase==='login') formErr(ta(c==='bad_credentials'?'au_e_cred':c==='rate'?'au_e_rate':'au_e_net'));
    else if(c==='auth'){ mailExpired(); render(); dlg.dataset.verified=''; openMail(); formErr(ta('au_e_sess')); }
    else { render(); formErr(ta(c==='forbidden'?'au_none':c==='rate'?'au_e_busy':'au_e_down')); }
  }
  finally{mailBusy=false;}
}
function saveGh(){ return LA&&document.activeElement!==$('#gh-token')?saveMail():saveKey(); }
async function saveKey(){
  const t=($('#gh-token').value||'').trim(); if(!t) return formErr(tr('gh_paste'));
  const btn=LA?dlg.querySelector('[data-act="gh-key"]'):dlg.querySelector('button[type="submit"]'); btn.disabled=true; btn.textContent=tr('au_wait');
  try{
    await connectGh(t); try{localStorage.setItem(TOKEN_KEY,t);}catch(e){}
    if(LA){ dlg.dataset.verified=''; if(await LA.sesion()){mailBusy=true; try{await LA.salir();}catch(e){} mailBusy=false;} }
    remote.etag={}; S.noDb=false; await refresh(); dlg.close(); render();
    toast(tr(GH.push?'gh_ok_push':'gh_ok_ro',GH.login));
  }catch(err){ btn.disabled=false; btn.textContent=tr('gh_go'); formErr(tr(err.code==='auth'?'gh_bad':err.code==='forbidden'?'gh_forb':'gh_unav')); }
}
function download(){
  const url=URL.createObjectURL(new Blob([JSON.stringify({mantenimiento:M,registro:DATA},null,1)+'\n'],{type:'application/json'})), a=document.createElement('a');
  a.href=url; a.download=`mantenimiento_${todayIso()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}
window.addEventListener('beforeunload',e=>{ if(pendingOps.length||flushing){e.preventDefault(); e.returnValue='';} });

/* ---------- Events ---------- */
function setView(v){S.view=v; try{localStorage.setItem('mt.view',v)}catch(e){} if(location.hash!=='#'+v) history.replaceState(null,'','#'+v); render(); window.scrollTo(0,0);}
document.addEventListener('click',async ev=>{
  const op=ev.target.closest('[data-open]'); if(op){const d=document.getElementById(op.dataset.open); if(d) d.open=true; return;}
  if(ev.target.closest('a[href]')) return;
  const v=ev.target.closest('[data-view]'); if(v){setView(v.dataset.view); return;}
  const t=ev.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  if(a==='row') openRow(id);
  else if(a==='rec-plan') openRec(null,{planId:id,status:'Planned'});
  else if(a==='rec-done'){const pl=(IX.recs.get(id)||[]).find(r=>r.status==='Planned'); if(pl) openRec(pl.id,{status:'Done',date:todayIso()}); else openRec(null,{planId:id,status:'Done'});}
  else if(a==='rec-edit') openRec(id);
  else if(a==='close') dlg.close();
  else if(a==='del') deleteFromDialog(t);
  else if(a==='kpi'){const k=t.dataset.k; if(k==='corrective'||k==='documents') return setView(k); S.f={status:k==='planned'?[]:[k],type:[],provider:[]}; S.q=''; setView(k==='planned'?'annual':'plan');}
  else if(a==='clear-f'){S.f={status:[],type:[],provider:[]}; S.q=''; render();}
  else if(a==='clear-docf'){S.docf={kind:[]}; S.q=''; render();}
  else if(a==='fchip'){const arr=S[t.dataset.scope][t.dataset.k], v2=t.dataset.v, i=arr.indexOf(v2); if(i<0) arr.push(v2); else arr.splice(i,1); render();}
  else if(a==='cell'){const r=t.dataset.r; if(r) return openRec(r); if(S.ro) return openRow(id); const ms=t.dataset.m; openRec(null,{planId:id,status:mIdx(ms)>=nowIdx()?'Planned':'Done',month:ms,date:mIdx(ms)<nowIdx()?ms+'-01':''});}
  else if(a==='plan-nav'){const d=+t.dataset.d, y=Math.floor(nowIdx()/12); S.plan.start=d===0?null:(S.plan.start??y)+d; render();}
  else if(a==='plan-span'){S.plan.span=+t.dataset.s; try{localStorage.setItem('mt.span',S.plan.span)}catch(e){} render();}
  else if(a==='settings') openSettings();
  else if(a==='download') download();
  else if(a==='gh'){ if(LOCAL) toast(tr('local_gh')); else openGh(); }
  else if(a==='local-reset'){try{localStorage.removeItem(LS_LOCAL);}catch(e){} remote.data=null; await refresh(); toast(tr('local_reset'));}
  else if(a==='gh-off') disconnectGh();
  else if(a==='gh-out'){dlg.close(); mailSignOut();}
  else if(a==='gh-key') saveKey();
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){S.q=ev.target.value; const pos=ev.target.selectionStart; render(); const q=$('#q'); if(q){q.focus(); try{q.setSelectionRange(pos,pos)}catch(e){}}}
});
document.addEventListener('change',ev=>{ if(dlg.open&&dlg.contains(ev.target)) recHints(); });
document.addEventListener('submit',ev=>{ if(ev.target.id!=='dlg-form') return; ev.preventDefault(); if(dlg.dataset.kind==='gh') saveGh(); else saveDialog(); });
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1); if(VIEWS.some(x=>x[0]===h)&&h!==S.view) setView(h);});

/* ---------- Language ---------- */
/* An open dialog is drawn again in the new language, keeping what was typed; not while a sign-in or key check is running. */
function redrawDialog(){
  const f=$('#dlg-form'), k=dlg.dataset.kind; if(!f||f.querySelector('button:disabled')) return;
  const vals=[...f.querySelectorAll('input[id],select[id],textarea[id]')].map(el=>[el.id,el.value]), det=[...f.querySelectorAll('details')].map(d=>d.open);
  if(k==='row') openRow(dlg.dataset.id);
  else if(k==='rec') openRec(dlg.dataset.id||null,readForm());
  else if(k==='cfg') openSettings();
  else if(k==='gh') openGh();
  else return;
  vals.forEach(([id,v])=>{const el=document.getElementById(id); if(el) el.value=v;});
  dlg.querySelectorAll('details').forEach((d,i)=>{if(i<det.length) d.open=det[i];});
  recHints();
}
function applyLang(){LabLang.apply(I18N); document.title=tr('title');}
LabLang.onChange(()=>{applyLang(); render(); if(dlg.open) redrawDialog();});

/* ---------- Boot ---------- */
applyLang();
render();
(async()=>{
  if(LA&&!LOCAL){ await LA.listo; const s=await LA.sesion();
    if(s){ GH.modo='correo'; GH.email=s.email; try{await connectMail(s.email);}catch(err){ if(err.code==='auth') mailExpired(); } }
    /* Signed out in another tab, or the session could not be renewed: same as a 401. Signed in as someone else in another
       tab: reconnect with that session. */
    LA.onCambio(x=>{ if(mailBusy||!byMail()) return;
      if(!x){ if(!GH.expired){mailExpired(); render();} }
      else if(x.email!==GH.email||GH.expired) mailSwitch(x.email); }); }
  if(GH.modo==='clave'&&GH.token&&!LOCAL){ try{await connectGh(GH.token);}catch(err){ if(err.code==='auth') GH.invalid=true; } }
  await refresh(); render();
  /* Polling: 30 s with a GitHub key, 60 s with an email session (free plan limits), only while the tab is visible. */
  const every=LA?()=>byMail()?60000:GH.token?30000:60000:(ms=>()=>ms)(GH.token?30000:60000);
  const poll=()=>setTimeout(()=>{ if(!document.hidden&&!dlg.open) refresh(); poll(); }, every()); poll();
})();
</script>
